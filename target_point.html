<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISSF Target with Punch-In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    .app-wrapper {
      position: fixed;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #target {
      width: 100%;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
      background: #f5f5f5;
    }
    .ui-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
    }
    .shot-list {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-family: monospace;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      min-width: 130px;
      cursor: pointer;
      pointer-events: auto;
    }
    .shot-list .shot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
      gap: 8px;
    }
    .shot-list .shot-row span:nth-child(1) {
      text-align: left;
      min-width: 30px;
    }
    .shot-list .shot-row span:nth-child(2) {
      text-align: right;
      min-width: 40px;
    }
    .shot-list .shot-row span:nth-child(3) {
      text-align: right;
      min-width: 20px;
    }
    .shot-list .shot-row.total {
      border-top: 1px solid rgba(255,255,255,0.2);
      margin-top: 4px;
      padding-top: 4px;
      font-weight: bold;
    }
    .shot-list.hidden {
      display: none;
    }
    .list-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      user-select: none;
      display: none;
      pointer-events: auto;
    }
    .list-toggle.visible {
      display: block;
      pointer-events: auto;
    }
.hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff1a1a;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .hint.hidden {
      opacity: 0;
    }
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    select {
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      user-select: none;
    }
    select option {
      background: #222;
      color: #fff;
    }
    button {
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
      user-select: none;
    }
    button:hover { background: rgba(60, 60, 60, 0.95); }
    button:active { transform: scale(0.96); }
    button.primary { background: rgba(0, 100, 255, 0.85); border-color: rgba(0, 100, 255, 0.6); }
    button.primary:hover { background: rgba(0, 80, 200, 0.95); }
    .shot-marker { pointer-events: all; cursor: grab; }
    .shot-marker.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="ui-overlay">
      <div class="shot-list" id="shotList"></div>
      <button class="list-toggle" id="listToggleBtn">Show List</button>
      <div class="hint" id="hint">Tap to mark</div>
      <div class="controls">
        <select id="targetSelect">
          <option value="25m">25m Pistol</option>
          <option value="10m">10m Air Pistol</option>
        </select>
        <button id="zoomBtn" class="primary">Zoom In</button>
        <button id="clearBtn">Clear Shots</button>
      </div>
    </div>
    <svg id="target" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script>
    const TARGETS = {
      '25m': {
        name: '25m',
        viewBoxSize: 550,
        center: 275,
        scale: 1,
        rings: [250, 225, 200, 175, 150, 125, 100, 75, 50, 25, 12.5],
        blackZoneRadius: 100,
        zoomRingRadius: 100,
        shotRadius: 2.75,
        numbers: {
          positions: [
            { x: 0, y: -37.5, val: 9 }, { x: 0, y: -62.5, val: 8 }, { x: 0, y: -87.5, val: 7 },
            { x: 0, y: -112.5, val: 6 }, { x: 0, y: -137.5, val: 5 }, { x: 0, y: -162.5, val: 4 },
            { x: 0, y: -187.5, val: 3 }, { x: 0, y: -212.5, val: 2 }, { x: 0, y: -237.5, val: 1 },
            { x: 37.5, y: 0, val: 9 }, { x: 62.5, y: 0, val: 8 }, { x: 87.5, y: 0, val: 7 },
            { x: 112.5, y: 0, val: 6 }, { x: 137.5, y: 0, val: 5 }, { x: 162.5, y: 0, val: 4 },
            { x: 187.5, y: 0, val: 3 }, { x: 212.5, y: 0, val: 2 }, { x: 237.5, y: 0, val: 1 },
            { x: 0, y: 37.5, val: 9 }, { x: 0, y: 62.5, val: 8 }, { x: 0, y: 87.5, val: 7 },
            { x: 0, y: 112.5, val: 6 }, { x: 0, y: 137.5, val: 5 }, { x: 0, y: 162.5, val: 4 },
            { x: 0, y: 187.5, val: 3 }, { x: 0, y: 212.5, val: 2 }, { x: 0, y: 237.5, val: 1 },
            { x: -37.5, y: 0, val: 9 }, { x: -62.5, y: 0, val: 8 }, { x: -87.5, y: 0, val: 7 },
            { x: -112.5, y: 0, val: 6 }, { x: -137.5, y: 0, val: 5 }, { x: -162.5, y: 0, val: 4 },
            { x: -187.5, y: 0, val: 3 }, { x: -212.5, y: 0, val: 2 }, { x: -237.5, y: 0, val: 1 }
          ],
          fontSize: 10
        }
      },
      '10m': {
        name: '10m',
        viewBoxSize: 200,
        center: 100,
        scale: 200 / 550,
        rings: [77.75, 69.75, 61.75, 53.75, 45.75, 37.75, 29.75, 21.75, 13.75, 5.75, 2.5],
        blackZoneRadius: 29.75,
        zoomRingRadius: 29.75,
        shotRadius: 2.25,
        numbers: {
          positions: [
            { x: 0, y: -9.75, val: 9 }, { x: 0, y: -17.75, val: 8 }, { x: 0, y: -25.75, val: 7 },
            { x: 0, y: -33.75, val: 6 }, { x: 0, y: -41.75, val: 5 }, { x: 0, y: -49.75, val: 4 },
            { x: 0, y: -57.75, val: 3 }, { x: 0, y: -65.75, val: 2 }, { x: 0, y: -73.75, val: 1 },
            { x: 9.75, y: 0, val: 9 }, { x: 17.75, y: 0, val: 8 }, { x: 25.75, y: 0, val: 7 },
            { x: 33.75, y: 0, val: 6 }, { x: 41.75, y: 0, val: 5 }, { x: 49.75, y: 0, val: 4 },
            { x: 57.75, y: 0, val: 3 }, { x: 65.75, y: 0, val: 2 }, { x: 73.75, y: 0, val: 1 },
            { x: 0, y: 9.75, val: 9 }, { x: 0, y: 17.75, val: 8 }, { x: 0, y: 25.75, val: 7 },
            { x: 0, y: 33.75, val: 6 }, { x: 0, y: 41.75, val: 5 }, { x: 0, y: 49.75, val: 4 },
            { x: 0, y: 57.75, val: 3 }, { x: 0, y: 65.75, val: 2 }, { x: 0, y: 73.75, val: 1 },
            { x: -9.75, y: 0, val: 9 }, { x: -17.75, y: 0, val: 8 }, { x: -25.75, y: 0, val: 7 },
            { x: -33.75, y: 0, val: 6 }, { x: -41.75, y: 0, val: 5 }, { x: -49.75, y: 0, val: 4 },
            { x: -57.75, y: 0, val: 3 }, { x: -65.75, y: 0, val: 2 }, { x: -73.75, y: 0, val: 1 }
          ],
          fontSize: 8
        }
      }
    };

    let currentTarget = '25m';
    let TARGET = TARGETS[currentTarget];

    const svg = document.getElementById('target');
    const hintEl = document.getElementById('hint');
    const shotListEl = document.getElementById('shotList');
    const listToggleBtn = document.getElementById('listToggleBtn');
    const targetSelect = document.getElementById('targetSelect');
    const zoomBtn = document.getElementById('zoomBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    let listVisible = false;
    const MARKERS = [];
    
    function hideHint() {
      hintEl.style.display = 'none';
    }
    let isZoomed = true;
    let draggingMarker = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let previewCross = null;

    function buildTarget() {
      const vb = TARGET.viewBoxSize;
      const c = TARGET.center;
      const s = TARGET.scale;
      svg.setAttribute('viewBox', `0 0 ${vb} ${vb}`);
      svg.innerHTML = `
        <rect width="${vb}" height="${vb}" fill="#FFFFFF"/>
        <circle cx="${c}" cy="${c}" r="${TARGET.blackZoneRadius}" fill="#000000"/>
        <g transform="translate(${c}, ${c})">
          ${TARGET.rings.map(r => `<circle r="${r}" fill="none" stroke="${r <= TARGET.blackZoneRadius ? '#FFFFFF' : '#000000'}" stroke-width="${0.3 * s}"/>`).join('')}
          ${TARGET.numbers.positions.map(p => {
            const isWhite = p.val >= 7;
            return `<text x="${p.x}" y="${p.y}" fill="${isWhite ? '#FFFFFF' : '#000000'}" font-family="Arial, sans-serif" font-size="${TARGET.numbers.fontSize * s}" font-weight="bold" text-anchor="middle" dominant-baseline="central">${p.val}</text>`;
          }).join('')}
        </g>
        <g stroke="#FF0000" stroke-width="${0.8 * s}" fill="none">
          <line x1="${c-5}" y1="15" x2="${c+5}" y2="15"/><line x1="${c}" y1="10" x2="${c}" y2="20"/>
          <line x1="${c-5}" y1="${vb-15}" x2="${c+5}" y2="${vb-15}"/><line x1="${c}" y1="${vb-10}" x2="${c}" y2="${vb-20}"/>
          <line x1="15" y1="${c-5}" x2="15" y2="${c+5}"/><line x1="10" y1="${c}" x2="20" y2="${c}"/>
          <line x1="${vb-15}" y1="${c-5}" x2="${vb-15}" y2="${c+5}"/><line x1="${vb-10}" y1="${c}" x2="${vb-20}" y2="${c}"/>
        </g>
      `;
    }

    function switchTarget(targetKey) {
      currentTarget = targetKey;
      TARGET = TARGETS[targetKey];
      MARKERS.forEach(m => m.remove());
      MARKERS.length = 0;
      shotListEl.innerHTML = '';
      hintEl.style.display = '';
      if (previewCross) previewCross.remove();
      previewCross = null;
      buildTarget();
      applyZoom();
      createPreviewCross();
    }

    function updateListVisibility() {
      shotListEl.classList.toggle('hidden', !listVisible);
      listToggleBtn.classList.toggle('visible', !listVisible);
      listToggleBtn.textContent = listVisible ? 'Hide List' : 'Show List';
    }

    function createPreviewCross() {
      previewCross = document.createElementNS("http://www.w3.org/2000/svg", "g");
      previewCross.setAttribute("pointer-events", "none");
      previewCross.setAttribute("opacity", "0");
      
      for (let i = 0; i < 4; i++) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("stroke", "#ff1a1a");
        line.setAttribute("stroke-width", TARGET.scale * 1.5);
        previewCross.appendChild(line);
      }
      svg.appendChild(previewCross);
    }

    function updatePreviewCross(x, y) {
      if (!previewCross) return;
      const len = 30 * TARGET.scale;
      const gap = 8 * TARGET.scale;
      previewCross.setAttribute('transform', `translate(${x}, ${y})`);
      const lines = previewCross.querySelectorAll('line');
      lines[0].setAttribute('x1', -len); lines[0].setAttribute('y1', 0);
      lines[0].setAttribute('x2', -gap); lines[0].setAttribute('y2', 0);
      lines[1].setAttribute('x1', gap); lines[1].setAttribute('y1', 0);
      lines[1].setAttribute('x2', len); lines[1].setAttribute('y2', 0);
      lines[2].setAttribute('x1', 0); lines[2].setAttribute('y1', -len);
      lines[2].setAttribute('x2', 0); lines[2].setAttribute('y2', -gap);
      lines[3].setAttribute('x1', 0); lines[3].setAttribute('y1', gap);
      lines[3].setAttribute('x2', 0); lines[3].setAttribute('y2', len);
    }

    function hidePreviewCross() {
      if (previewCross) previewCross.setAttribute('opacity', '0');
    }

    function showPreviewCross() {
      if (previewCross) previewCross.setAttribute('opacity', '0.5');
    }

    function updateShotList() {
      let total = 0;
      let intTotal = 0;
      let blockTotal = 0;
      let blockIntTotal = 0;
      let html = '';
      MARKERS.forEach((group, i) => {
        const circle = group.querySelector('.marker-circle');
        const cx = parseFloat(circle.getAttribute('cx'));
        const cy = parseFloat(circle.getAttribute('cy'));
        const dx = cx - TARGET.center;
        const dy = cy - TARGET.center;
        const d = Math.sqrt(dx * dx + dy * dy) - TARGET.shotRadius;
        const score = calcScoreForDist(d);
        const intScore = Math.floor(score);
        total += score;
        intTotal += intScore;
        blockTotal += score;
        blockIntTotal += intScore;
        html += `<div class="shot-row"><span>${i + 1}.</span><span>${score.toFixed(1)}</span><span>${intScore}</span></div>`;
        if ((i + 1) % 10 === 0) {
          html += `<div class="shot-row total"><span></span><span>${blockTotal.toFixed(1)}</span><span>${blockIntTotal}</span></div>`;
          blockTotal = 0;
          blockIntTotal = 0;
        }
      });
      html += `<div class="shot-row total"><span>TOTAL</span><span>${total.toFixed(1)}</span><span>${intTotal}</span></div>`;
      shotListEl.innerHTML = html;
      shotListEl.scrollTop = shotListEl.scrollHeight;
    }

    function calcScoreForDist(d) {
      const ringRadii = TARGET.rings;
      const shotR = TARGET.shotRadius;
      if (d <= ringRadii[9]) return +(10.9 - (d + shotR) / (ringRadii[9] + shotR) * 0.9).toFixed(1);
      for (let i = 9; i >= 1; i--) {
        const outerR = ringRadii[i - 1];
        const innerR = ringRadii[i];
        if (d <= outerR) {
          const baseScore = i;
          return +((baseScore + 0.9) - (d - innerR) / (outerR - innerR) * 0.9).toFixed(1);
        }
      }
      return 0;
    }

    function getSVGPoint(event) {
      const point = svg.createSVGPoint();
      let clientX, clientY;
      if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      point.x = clientX;
      point.y = clientY;
      const ctm = svg.getScreenCTM().inverse();
      return point.matrixTransform(ctm);
    }

    function calcScore(x, y) {
      const dx = x - TARGET.center;
      const dy = y - TARGET.center;
      const d = Math.sqrt(dx * dx + dy * dy) - TARGET.shotRadius;
      return calcScoreForDist(d);
    }

    function addMarker(x, y) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "shot-marker");
      
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", TARGET.shotRadius);
      circle.setAttribute("fill", "rgba(255, 26, 26, 0.7)");
      circle.setAttribute("class", "marker-circle");
      
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("font-size", 4 * TARGET.scale);
      text.setAttribute("font-family", "system-ui, sans-serif");
      text.setAttribute("font-weight", "bold");
      text.setAttribute("fill", "#ffffff");
      text.setAttribute("class", "marker-number");
      text.textContent = MARKERS.length + 1;
      
      const scoreText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      scoreText.setAttribute("x", x - 4 * TARGET.scale);
      scoreText.setAttribute("y", y - 6 * TARGET.scale);
      scoreText.setAttribute("text-anchor", "end");
      scoreText.setAttribute("dominant-baseline", "central");
      scoreText.setAttribute("font-size", 5 * TARGET.scale);
      scoreText.setAttribute("font-family", "system-ui, sans-serif");
      scoreText.setAttribute("font-weight", "bold");
      scoreText.setAttribute("fill", "#ff1a1a");
      scoreText.setAttribute("class", "marker-score");
      scoreText.setAttribute("opacity", "0");
      
      group.appendChild(circle);
      group.appendChild(text);
      group.appendChild(scoreText);
      svg.appendChild(group);
      
      MARKERS.push(group);
      updateShotList();
      hideHint();
      return group;
    }

    function applyZoom() {
      const vb = TARGET.viewBoxSize;
      const c = TARGET.center;
      const zr = TARGET.zoomRingRadius;
      if (isZoomed) {
        svg.setAttribute('viewBox', `${c - zr} ${c - zr} ${zr * 2} ${zr * 2}`);
        zoomBtn.textContent = 'Zoom Out';
        zoomBtn.classList.remove('primary');
      } else {
        svg.setAttribute('viewBox', `0 0 ${vb} ${vb}`);
        zoomBtn.textContent = 'Zoom In';
        zoomBtn.classList.add('primary');
      }
    }

    function toggleZoom() {
      isZoomed = !isZoomed;
      applyZoom();
    }

    function onPointerDown(e) {
      const target = e.target;
      if (target.classList.contains('shot-marker') || target.closest('.shot-marker')) {
        const group = target.classList.contains('shot-marker') ? target : target.closest('.shot-marker');
        draggingMarker = group;
        draggingMarker.classList.add('dragging');
        const pt = getSVGPoint(e);
        dragOffsetX = pt.x - parseFloat(draggingMarker.querySelector('.marker-circle').getAttribute('cx'));
        dragOffsetY = pt.y - parseFloat(draggingMarker.querySelector('.marker-circle').getAttribute('cy'));
        showPreviewCross();
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      const pt = getSVGPoint(e);
      const isTouch = e.touches && e.touches.length > 0;
      const scale = isZoomed ? 2.75 : 1;
      const offsetX = isTouch ? -20 * TARGET.scale / scale : 0;
      const offsetY = isTouch ? -40 * TARGET.scale / scale : 0;
      updatePreviewCross(pt.x + offsetX, pt.y + offsetY);
      showPreviewCross();
      draggingMarker = addMarker(pt.x + offsetX, pt.y + offsetY);
      draggingMarker.classList.add('dragging');
      dragOffsetX = pt.x - draggingMarker.querySelector('.marker-circle').getAttribute('cx');
      dragOffsetY = pt.y - draggingMarker.querySelector('.marker-circle').getAttribute('cy');
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!draggingMarker) return;
      e.preventDefault();
      const pt = getSVGPoint(e);
      const cx = pt.x - dragOffsetX;
      const cy = pt.y - dragOffsetY;
      draggingMarker.querySelector('.marker-circle').setAttribute('cx', cx);
      draggingMarker.querySelector('.marker-circle').setAttribute('cy', cy);
      const numberText = draggingMarker.querySelector('.marker-number');
      numberText.setAttribute('x', cx);
      numberText.setAttribute('y', cy);
const score = calcScore(cx, cy);
      const scoreText = draggingMarker.querySelector('.marker-score');
      scoreText.textContent = score.toFixed(1);
      scoreText.setAttribute('x', cx - 4 * TARGET.scale);
      scoreText.setAttribute('y', cy - 6 * TARGET.scale);
      scoreText.setAttribute('opacity', '1');
      updatePreviewCross(cx, cy);
      updateShotList();
    }

    function onPointerUp(e) {
      if (draggingMarker) {
        const group = draggingMarker;
        const numberText = group.querySelector('.marker-number');
        const circle = group.querySelector('.marker-circle');
        const cx = parseFloat(circle.getAttribute('cx'));
        const cy = parseFloat(circle.getAttribute('cy'));
        numberText.setAttribute('x', cx);
        numberText.setAttribute('y', cy);
        numberText.textContent = MARKERS.indexOf(group) + 1;
        const scoreText = group.querySelector('.marker-score');
        scoreText.setAttribute('opacity', '0');
        scoreText.setAttribute('x', cx - 6 * TARGET.scale);
        scoreText.setAttribute('y', cy + 1.5 * TARGET.scale);
        group.classList.remove('dragging');
        draggingMarker = null;
        hidePreviewCross();
        updateShotList();
      }
    }

    svg.addEventListener('mousedown', onPointerDown);
    svg.addEventListener('touchstart', onPointerDown, { passive: false });
    svg.addEventListener('mousemove', onPointerMove);
    svg.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchend', onPointerUp);

    clearBtn.addEventListener('pointerup', () => {
      MARKERS.forEach(m => m.remove());
      MARKERS.length = 0;
      shotListEl.innerHTML = '';
    });

    zoomBtn.addEventListener('pointerup', toggleZoom);

    buildTarget();
    applyZoom();
    createPreviewCross();
    targetSelect.value = currentTarget;
    updateListVisibility();

    shotListEl.addEventListener('click', () => {
      listVisible = false;
      updateListVisibility();
    });

    listToggleBtn.addEventListener('pointerup', () => {
      listVisible = true;
      updateListVisibility();
    });

    targetSelect.addEventListener('change', (e) => {
      switchTarget(e.target.value);
    });
  </script>
</body>
</html>
