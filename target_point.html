<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISSF 25m Target with Punch-In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    .app-wrapper {
      position: fixed;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #target {
      width: 100%;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
      transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      transform-origin: center center;
      transform-box: fill-box;
      background: #f5f5f5;
    }
    .ui-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
    }
    .status {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
      .hint {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }
     .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    button {
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
      user-select: none;
    }
    button:hover { background: rgba(60, 60, 60, 0.95); }
    button:active { transform: scale(0.96); }
    button.primary { background: rgba(0, 100, 255, 0.85); border-color: rgba(0, 100, 255, 0.6); }
    button.primary:hover { background: rgba(0, 80, 200, 0.95); }
    .shot-marker { pointer-events: all; cursor: grab; }
    .shot-marker.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="ui-overlay">
      <div class="status">Shots: <span id="shotCount">0</span></div>
      <div class="hint">Tap to mark • Button to zoom</div>
      <div class="controls">
        <button id="zoomBtn" class="primary">Punch In (7-Ring)</button>
        <button id="clearBtn">Clear Shots</button>
      </div>
    </div>
    <svg id="target" viewBox="0 0 550 550" xmlns="http://www.w3.org/2000/svg">
      <rect width="550" height="550" fill="#FFFFFF"/>
      <circle cx="275" cy="275" r="100" fill="#000000"/>
      <g transform="translate(275, 275)">
        <circle r="250" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="225" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="200" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="175" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="150" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="125" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="100" fill="none" stroke="#000000" stroke-width="0.3"/>
        <circle r="75" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>
        <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>
        <circle r="25" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>
        <circle r="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>

        <!-- 12 o'clock -->
        <text x="0" y="-37.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">9</text>
        <text x="0" y="-62.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text>
        <text x="0" y="-87.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text>
        <text x="0" y="-112.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text>
        <text x="0" y="-137.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
        <text x="0" y="-162.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
        <text x="0" y="-187.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
        <text x="0" y="-212.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
        <text x="0" y="-237.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>

        <!-- 3 o'clock -->
        <text x="37.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">9</text>
        <text x="62.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text>
        <text x="87.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text>
        <text x="112.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text>
        <text x="137.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
        <text x="162.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
        <text x="187.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
        <text x="212.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
        <text x="237.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>

        <!-- 6 o'clock -->
        <text x="0" y="37.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">9</text>
        <text x="0" y="62.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text>
        <text x="0" y="87.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text>
        <text x="0" y="112.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text>
        <text x="0" y="137.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
        <text x="0" y="162.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
        <text x="0" y="187.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
        <text x="0" y="212.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
        <text x="0" y="237.5" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>

        <!-- 9 o'clock -->
        <text x="-37.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">9</text>
        <text x="-62.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text>
        <text x="-87.5" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">7</text>
        <text x="-112.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text>
        <text x="-137.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
        <text x="-162.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
        <text x="-187.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
        <text x="-212.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
        <text x="-237.5" y="0" fill="#000000" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>
      </g>
      <g stroke="#FF0000" stroke-width="0.8" fill="none">
        <line x1="270" y1="15" x2="280" y2="15"/><line x1="275" y1="10" x2="275" y2="20"/>
        <line x1="270" y1="535" x2="280" y2="535"/><line x1="275" y1="530" x2="275" y2="540"/>
        <line x1="15" y1="270" x2="15" y2="280"/><line x1="10" y1="275" x2="20" y2="275"/>
        <line x1="535" y1="270" x2="535" y2="280"/><line x1="530" y1="275" x2="540" y2="275"/>
      </g>
    </svg>
  </div>

  <script>
    const svg = document.getElementById('target');
    const shotCountEl = document.getElementById('shotCount');
    const zoomBtn = document.getElementById('zoomBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    const MARKERS = [];
    let shotCount = 0;
    let isZoomed = false;
    let draggingMarker = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function getSVGPoint(event) {
      let clientX, clientY;
      if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      const baseSize = Math.min(window.innerWidth, window.innerHeight);
      const scale = isZoomed ? 550 / 200 : 1;
      const renderedSize = baseSize * scale;
      const svgLeft = (window.innerWidth - renderedSize) / 2;
      const svgTop = (window.innerHeight - renderedSize) / 2;
      return {
        x: (clientX - svgLeft) * (550 / renderedSize),
        y: (clientY - svgTop) * (550 / renderedSize)
      };
    }

    function getTouchOffset(e) {
      if (!e.touches || e.touches.length === 0) return { x: 0, y: 0 };
      return { x: -10 / (isZoomed ? 2.75 : 1), y: -10 / (isZoomed ? 2.75 : 1) };
    }

    function calcScore(x, y) {
      const dx = x - 275;
      const dy = y - 275;
      const d = Math.sqrt(dx * dx + dy * dy) - 2.75;
      if (d <= 0) return 10.9;
      if (d <= 25) return +(10.9 - (d + 2.75) / 27.75 * 0.9).toFixed(1);
      if (d <= 50) return +(9.9 - (d - 25) / 25 * 0.9).toFixed(1);
      if (d <= 75) return +(8.9 - (d - 50) / 25 * 0.9).toFixed(1);
      if (d <= 100) return +(7.9 - (d - 75) / 25 * 0.9).toFixed(1);
      if (d <= 125) return +(6.9 - (d - 100) / 25 * 0.9).toFixed(1);
      if (d <= 150) return +(5.9 - (d - 125) / 25 * 0.9).toFixed(1);
      if (d <= 175) return +(4.9 - (d - 150) / 25 * 0.9).toFixed(1);
      if (d <= 200) return +(3.9 - (d - 175) / 25 * 0.9).toFixed(1);
      if (d <= 225) return +(2.9 - (d - 200) / 25 * 0.9).toFixed(1);
      if (d <= 250) return +(1.9 - (d - 225) / 25 * 0.9).toFixed(1);
      return 0;
    }

    function addMarker(x, y) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "shot-marker");
      
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", "2.75");
      circle.setAttribute("fill", "rgba(255, 26, 26, 0.7)");
      circle.setAttribute("class", "marker-circle");
      
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y - 5);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", "4");
      text.setAttribute("font-family", "system-ui, sans-serif");
      text.setAttribute("font-weight", "bold");
      text.setAttribute("fill", "#ff1a1a");
      text.setAttribute("class", "marker-number");
      text.textContent = shotCount + 1;
      
      group.appendChild(circle);
      group.appendChild(text);
      svg.appendChild(group);
      
      shotCount++;
      shotCountEl.textContent = shotCount;
      MARKERS.push(group);
      return group;
    }

    function getOptimalScale() {
      return 550 / 200;
    }

    function applyZoom() {
      if (isZoomed) {
        svg.style.transform = `scale(${getOptimalScale()})`;
        zoomBtn.textContent = 'Zoom Out';
        zoomBtn.classList.remove('primary');
      } else {
        svg.style.transform = 'scale(1)';
        zoomBtn.textContent = 'Punch In (7-Ring)';
        zoomBtn.classList.add('primary');
      }
    }

    function toggleZoom() {
      isZoomed = !isZoomed;
      applyZoom();
    }

    function onPointerDown(e) {
      const target = e.target;
      if (target.classList.contains('shot-marker') || target.closest('.shot-marker')) {
        const group = target.classList.contains('shot-marker') ? target : target.closest('.shot-marker');
        draggingMarker = group;
        draggingMarker.classList.add('dragging');
        const pt = getSVGPoint(e);
        dragOffsetX = pt.x - parseFloat(draggingMarker.querySelector('.marker-circle').getAttribute('cx'));
        dragOffsetY = pt.y - parseFloat(draggingMarker.querySelector('.marker-circle').getAttribute('cy'));
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      const pt = getSVGPoint(e);
      const offset = getTouchOffset(e);
      draggingMarker = addMarker(pt.x + offset.x, pt.y + offset.y);
      draggingMarker.classList.add('dragging');
      dragOffsetX = pt.x - draggingMarker.querySelector('.marker-circle').getAttribute('cx');
      dragOffsetY = pt.y - draggingMarker.querySelector('.marker-circle').getAttribute('cy');
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!draggingMarker) return;
      e.preventDefault();
      const pt = getSVGPoint(e);
      const cx = pt.x - dragOffsetX;
      const cy = pt.y - dragOffsetY;
      draggingMarker.querySelector('.marker-circle').setAttribute('cx', cx);
      draggingMarker.querySelector('.marker-circle').setAttribute('cy', cy);
      const numberText = draggingMarker.querySelector('.marker-number');
      numberText.setAttribute('x', cx);
      numberText.setAttribute('y', cy - 5);
      const score = calcScore(cx, cy);
      numberText.textContent = score;
    }

    function onPointerUp(e) {
      if (draggingMarker) {
        const group = draggingMarker;
        const numberText = group.querySelector('.marker-number');
        const circle = group.querySelector('.marker-circle');
        const cx = parseFloat(circle.getAttribute('cx'));
        const cy = parseFloat(circle.getAttribute('cy'));
        numberText.setAttribute('x', cx);
        numberText.setAttribute('y', cy - 5);
        numberText.textContent = MARKERS.indexOf(group) + 1;
        group.classList.remove('dragging');
        draggingMarker = null;
      }
    }

    svg.addEventListener('mousedown', onPointerDown);
    svg.addEventListener('touchstart', onPointerDown, { passive: false });
    svg.addEventListener('mousemove', onPointerMove);
    svg.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchend', onPointerUp);

    clearBtn.addEventListener('pointerup', () => {
      MARKERS.forEach(m => m.remove());
      MARKERS.length = 0;
      shotCount = 0;
      shotCountEl.textContent = 0;
    });

    zoomBtn.addEventListener('pointerup', toggleZoom);

    window.addEventListener('resize', () => {
      if (isZoomed) applyZoom();
    });
  </script>
</body>
</html>
